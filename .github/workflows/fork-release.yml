# GymKing fork only: pushing a tag like v2026.10.10-gk.1 tests the tagged
# commit, builds the extension and publishes the zip as a GitHub release.
# See FORK.md.
name: Fork release

on:
  push:
    tags: ['v*-gk.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run typecheck

      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%-gk.*}"
          build="${tag##*-gk.}"
          pkg=$(jq -r .version package.json)
          if [ "$base" != "$pkg" ]; then
            echo "Tag base $base doesn't match package.json version $pkg" >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - run: bun run changelog:gen && bunx wxt zip
        env:
          FORK_BUILD: ${{ steps.version.outputs.build }}

      - run: |
          zip="alfred-${{ steps.version.outputs.name }}-chrome.zip"
          mv .output/*-chrome.zip "$zip"
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "Alfred ${{ steps.version.outputs.name }}" \
            --notes-file <(sed -n '/^## Install/,$p' FORK.md) \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
